<div class="brutal-dialog-card">
  <div class="dialog-header header-pink">
    <div class="window-controls">
      <span class="control-dot dot-red"></span>
      <span class="control-dot dot-yellow"></span>
      <span class="control-dot dot-green"></span>
    </div>
    <div class="dialog-title">➕ ADD NEW HOTEL ROOM</div>
    <div style="width: 20px;"></div>
  </div>

  <form (ngSubmit)="Crear()" class="dialog-body">
    <div class="mb-3">
      <label for="cantdepersonas" class="form-label">Guest Capacity (Persons)</label>
      <input
        type="number"
        class="form-control"
        id="cantdepersonas"
        [(ngModel)]="rooms.cantdepersonas"
        name="cantdepersonas"
        placeholder="e.g. 2"
        required
      />
    </div>

    <div class="mb-3">
      <label for="precio" class="form-label">Nightly Rate (USD)</label>
      <input
        type="number"
        class="form-control"
        id="precio"
        [(ngModel)]="rooms.precio"
        name="precio"
        placeholder="e.g. 150"
        required
      />
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-lg"></i> Create Room
      </button>
    </div>
  </form>
</div>
