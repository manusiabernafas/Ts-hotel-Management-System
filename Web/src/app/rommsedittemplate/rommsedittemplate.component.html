<div class="brutal-dialog-card">
  <div class="dialog-header header-blue">
    <div class="window-controls">
      <span class="control-dot dot-red"></span>
      <span class="control-dot dot-yellow"></span>
      <span class="control-dot dot-green"></span>
    </div>
    <div class="dialog-title">✏️ EDIT ROOM DETAILS</div>
    <div style="width: 20px;"></div>
  </div>

  <form (ngSubmit)="editar()" class="dialog-body">
    <div class="mb-3">
      <label for="cant_peoples" class="form-label">Guest Capacity (Persons)</label>
      <input
        type="number"
        class="form-control"
        id="cant_peoples"
        [(ngModel)]="rooms.cantdepersonas"
        name="cantdepersonas"
        required
      />
    </div>

    <div class="mb-3">
      <label for="price_room" class="form-label">Nightly Rate (USD)</label>
      <input
        type="number"
        class="form-control"
        id="price_room"
        [(ngModel)]="rooms.precio"
        name="precio"
        required
      />
    </div>

    <div class="mb-3">
      <label for="room_reserved" class="form-label">Reservation Status</label>
      <select class="form-control" id="room_reserved" [(ngModel)]="rooms.reservada" name="reservada">
        <option [ngValue]="true">Reserved (Occupied)</option>
        <option [ngValue]="false">Available (Vacant)</option>
      </select>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save2-fill"></i> Save Changes
      </button>
    </div>
  </form>
</div>
