<div class="brutal-dialog-card">
  <div class="dialog-header header-blue">
    <div class="window-controls">
      <span class="control-dot dot-red"></span>
      <span class="control-dot dot-yellow"></span>
      <span class="control-dot dot-green"></span>
    </div>
    <div class="dialog-title">📅 EDIT RESERVATION SCHEDULE</div>
    <div style="width: 20px;"></div>
  </div>

  <form (ngSubmit)="editar()" class="dialog-body">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="fecha_entrada_edit" class="form-label">Check-in Date</label>
        <input type="date" class="form-control" id="fecha_entrada_edit" [(ngModel)]="reservation.fecha_entrada" name="fecha_entrada">
      </div>
      <div class="col-md-6 mb-3">
        <label for="fecha_salida_edit" class="form-label">Check-out Date</label>
        <input type="date" class="form-control" id="fecha_salida_edit" [(ngModel)]="reservation.fecha_salida" name="fecha_salida">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="numero_huspedes_edit" class="form-label">Number of Guests</label>
        <input type="number" class="form-control" id="numero_huspedes_edit" [(ngModel)]="reservation.numero_huspedes" name="numero_huspedes">
      </div>
      <div class="col-md-6 mb-3">
        <label for="preciototal_edit" class="form-label">Total Price ($ USD)</label>
        <input type="number" class="form-control" id="preciototal_edit" [(ngModel)]="reservation.preciototal" name="preciototal">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="id_cliente_edit" class="form-label">Client ID</label>
        <input type="number" class="form-control" id="id_cliente_edit" [(ngModel)]="reservation.id_cliente" name="id_cliente">
      </div>
      <div class="col-md-6 mb-3">
        <label for="id_habitacion_edit" class="form-label">Room ID</label>
        <input type="number" class="form-control" id="id_habitacion_edit" [(ngModel)]="reservation.id_habitacion" name="id_habitacion">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-calendar2-check-fill"></i> Save Reservation
      </button>
    </div>
  </form>
</div>
